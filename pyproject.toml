[project]
name = "jimtut"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium[classic-control,mujoco]>=1.2.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.3",
    "torch>=2.9.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31.7",
    "ruff>=0.14.1",
]

[tool.ruff.lint.pycodestyle]
# E501 reports lines that exceed the length of 100.
max-line-length = 100
